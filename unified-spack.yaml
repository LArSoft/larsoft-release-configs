spack:
  config:
    deprecated: true
  include:

  - git: https://github.com/art-framework-suite/art-release-configs
    tag: art-3.14.04
    paths:
    - included_yaml/gcc-12-toolchain.yaml
    - included_yaml/packages-art.yaml
    - included_yaml/specs-art.yaml

  - git: https://github.com/SBNSoftware/sbn-release-configs
    commit: bbec31e7a1309e27114261e9baa226b2f5aea6b8
    paths:
    - included_yaml/sbn-packages.yaml
    - included_yaml/sbnd-packages.yaml
    - included_yaml/icarus-packages.yaml
    - included_yaml/sbn-specs.yaml
    - included_yaml/sbnd-specs.yaml
    - included_yaml/icarus-specs.yaml

  - git: https://github.com/DUNE/dune-release-configs
    commit: 82d2af585c9a7457f6ae3dd0c315cefe93d035ea
    paths:
    - included_yaml/dune-packages.yaml
    - included_yaml/dune-specs.yaml

  - git: https://github.com/uboone/uboone-release-configs
    tag: uboone-10.22.0
    paths:
    - included_yaml/uboone_packages.yaml
    - included_yaml/uboone_specs.yaml

  - git: https://github.com/LArSoft/larsoft-release-configs
    tag: larsoft-10.22.00
    paths:
    - included_yaml/larsoft-packages.yaml
    - included_yaml/larsoft-specs.yaml

  - git: https://github.com/NuSoftHEP/nusofthep-release-configs
    tag: nusofthep-3.22.01
    paths:
    - included_yaml/nusofthep-packages.yaml
    - included_yaml/nusofthep-specs.yaml

  - git: https://github.com/fnal-fife/fife-release-configs
    tag: 2.8.0.4
    paths:
    - included_yaml/fife_packages.yaml
    - included_yaml/fife_specs.yaml



  specs:
    - $specs_art
    - $specs_nusofthep
    - $specs_larsoft
    - $fife_specs
    - $specs_dune
    - $specs_icarus
    - $specs_sbn
    - $specs_sbnd
    - $specs_uboone
    - artdaq-core %build_compiler
    - larcv2 %build_compiler
    - larcv %build_compiler
    - nusystematics %build_compiler
    - systematicstools %build_compiler
    - r-m-dd-config
    - py-srproxy
    - py-ipykernel
    - geant4reweight
    - snakemake
  concretizer:
    unify: true
    reuse:
      from:
      - type: local
      - type: external
  view: false
  packages:
    all:
      providers:
        libc:
        - glibc
        'zlib-api:':
        - zlib
      variants:
      - generator=ninja
      - build_type=Release
      - cxxstd=17
      target:
      - x86_64_v3
    python:
      require:
      - "@:3.11"
    cuda:
      require:
      - "@12.6"
    geant4:
      require:
      - build_type=RelWithDebInfo
      - generator=ninja
      - cxxstd=17
    grpc:
      require:
      - build_type=RelWithDebInfo
      - generator=ninja
      - cxxstd=17
    py-tensorflow:
      require:
      - +cuda
      - cuda_arch=80
    py-torch:
      require:
      - +cuda
      - cuda_arch=80
    r-m-dd-config:
      require:
      - experiment=dune
    root:
      require:
      - +xrootd
    nusystematics:
      require:
      - "@1"
    systematicstools:
      require:
      - "@1"
    trace:
      require:
      - "@:v3_23_00"
    'duneana:':
      require:
      - "@develop"
    'duneanaobj:':
      require:
      - "@develop"
    'dunecalib:':
      require:
      - "@develop"
    'dunecore:':
      require:
      - "@develop"
    'dunedaqdataformats:':
      require:
      - "@develop"
    'dunedataprep:':
      require:
      - "@develop"
    'dunedetdataformats:':
      require:
      - "@develop"
    'duneexamples:':
      require:
      - "@develop"
    'duneopdet:':
      require:
      - "@develop"
    'dunepdlegacy:':
      require:
      - "@develop"
    'duneprototypes:':
      require:
      - "@develop"
    'dunereco:':
      require:
      - "@develop"
    'dunesim:':
      require:
      - "@develop"
    'dunesw:':
      require:
      - "@develop"
    'duneutil:':
      require:
      - "@develop"
    'protoduneana:':
      require:
      - "@develop"
    'sbnalg:':
      require:
      - '@develop'
    'sbnanaobj:':
      require:
      - '@develop'
    'sbncode:':
      require:
      - '@develop'
    'sbndcode:':
      require:
      - '@develop'
    'sbndaq-artdaq-core:':
