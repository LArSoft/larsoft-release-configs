spack:
  config:
    deprecated: true
  include:
  - git: https://github.com/art-framework-suite/art-release-configs
    tag: art-3.14.04
    paths:
    - included_yaml/gcc-12-toolchain.yaml
    - included_yaml/packages-art.yaml
    - included_yaml/specs-art.yaml

  - git: https://github.com/DUNE/dune-release-configs
    tag: dunesw-10.22.00d01-justin-01.06.04
    paths:
    - included_yaml/dune-packages.yaml
    - included_yaml/dune-specs.yaml

  - git: https://github.com/LArSoft/larsoft-release-configs
    tag: larsoft-10.23.00
    paths:
    - included_yaml/larsoft-packages.yaml
    - included_yaml/larsoft-specs.yaml

  - git: https://github.com/NuSoftHEP/nusofthep-release-configs
    tag: nusofthep-3.22.01
    paths:
    - included_yaml/nusofthep-packages.yaml
    - included_yaml/nusofthep-specs.yaml

  - git: https://github.com/fnal-fife/fife-release-configs
    tag: 2.8.0.4
    paths:
    - included_yaml/fife_packages.yaml
    - included_yaml/fife_specs.yaml

  upstreams:
    cvmfs-larsoft:
      install_tree: /cvmfs/larsoft.opensciencegrid.org/spack-fnal-v1.1.1/opt/spack

# The following definitions should be defined by experiments in exp_packages.yaml and exp_specs.yaml
# and the git:(repo urls) and tag: or commit: included above.
#
  specs:
    - $specs_art
    - $specs_nusofthep
    - $specs_larsoft
    - $fife_specs
    - $specs_dune

  concretizer:
    unify: true
    reuse:
      from:
      - type: environment
        path: /cvmfs/larsoft.opensciencegrid.org/spack-fnal-v1.1.1/var/spack/environments/larsoft-v10_23_00-unified-cuda-python-3_11-trimmed-rc1
  view: false
  packages:
    all:
      providers:
        libc:
        - glibc
        'zlib-api:':
        - zlib
      variants:
      - generator=ninja
      - build_type=Release
      - cxxstd=17
      target:
      - x86_64_v3
    python:
      require:
      - "@:3.11"
    nusystematics:
      require:
      - "@1"
    systematicstools:
      require:
      - "@1"
    trace:
      require:
      - "@:v3_23_00"
    'duneana:':
      require:
      - "@develop"
    'duneanaobj:':
      require:
      - "@develop"
    'dunecalib:':
      require:
      - "@develop"
    'dunecore:':
      require:
      - "@develop"
    'dunedaqdataformats:':
      require:
      - "@develop"
    'dunedataprep:':
