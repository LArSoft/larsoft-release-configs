# -*- YAML -*-
# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  specs:
  - >-
    gcc@12.5.0 +binutils +bootstrap +profiled +strip ~nvptx languages=c,c++,fortran,lto %c,cxx=gcc@11.5.0
  - 'binutils@:2 +gas +gold +headers +ld +lto +plugins'
  view: false
  concretizer:
    reuse:
      from:
      - type: local
      - type: external
    targets:
      granularity: generic
    unify: true
  packages:
    all:
      target:
      - x86_64_v2
